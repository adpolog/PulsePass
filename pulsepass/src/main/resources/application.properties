spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepass_e2e
spring.datasource.username=postgres
spring.datasource.password=postgres

# The JWT signing key is never stored in the repository (PRD Seguridad 12.2, NFR-SEC-001).
# It comes from the PULSEPASS_JWT_SECRET_BASE64 environment variable or, in local development,
# from an untracked .env file next to pom.xml (see .env.example). Without it the app refuses to start.
spring.config.import=optional:file:.env[.properties]
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true